# Set name to "<client-slug>-portal" per client (matching client.config.json client.slug).
name = "mimwell-portal"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# Access posture — workers.dev guidance. If this portal serves client
# knowledge behind Cloudflare Access on a custom domain, remember the default
# *.workers.dev subdomain serves the SAME worker with NO Access in front — an
# unauthenticated side door to the entire corpus. When going live on an
# Access-gated custom domain, close it by uncommenting (and filling the
# domain):
#
# workers_dev = false
# routes = [
#   { pattern = "portal.example.com", custom_domain = true }
# ]

# D1 edge store: serve the compiled brain from Cloudflare D1 instead of loading
# app/brain.json into worker memory per request. ENABLE ONLY when serving from
# D1: features.brain_d1 = true AND brain.store = "d1" (scripts/brain-d1-deploy.py
# enforces this precondition). The block ships COMMENTED so `wrangler deploy`
# works with zero D1 setup. The binding name MUST be "DB"; worker.js reads env.DB.
#
# database_id is per deployment. Keep the real id out of Git: provision with
#   wrangler d1 create <client-slug>-brain
# then uncomment the block in your working copy with the real id, run
# `make brain-d1-push`, and do not commit that edit.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "client-brain"
# database_id = "00000000-0000-0000-0000-000000000000"  # placeholder, never commit a real id
