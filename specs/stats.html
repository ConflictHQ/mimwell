<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spec Stats</title>
<style>
  :root {
    /* ── Branding seam: defaults below are overwritten at runtime from
       /client.config.json (branding.colors + branding.fonts). The page renders
       immediately with these values, then re-brands when the config loads. ── */
    --kb-primary:      #1E9C8F;
    --kb-link:         #2F97BF;
    --kb-accent:       #B98536;
    --kb-bg:           #0B1619;
    --kb-bg-deep:      #060D0F;
    --kb-surface:      #0F1E22;
    --kb-border:       #1D3238;
    --kb-border-light: #27414A;
    --kb-text:         #E6EFEE;
    --kb-text-muted:   #93A9AB;
    --kb-text-faint:   #667D80;
    --kb-font-heading: 'Fraunces', Georgia, serif;
    --kb-font-body:    'Inter', system-ui, sans-serif;
    --kb-font-mono:    'JetBrains Mono', monospace;

    /* Local aliases — the stylesheet rules below reference these short names.
       They resolve to the --kb-* seam so a single config fetch re-brands all. */
    --bg:       #F4F5F8;
    --surface:  #FFFFFF;
    --surface2: #EDEFF5;
    --border:   #E2E8F0;
    --border2:  #D7DEEC;
    --red:      var(--kb-primary);
    --red-dim:  color-mix(in srgb, var(--kb-primary) 8%, transparent);
    --text:     #231F20;
    --muted:    #56575D;
    --dim:      #86868B;
    --green:    #1BA15E; --green-dim: rgba(27,161,94,0.1);
    --yellow:   #B5870E; --yellow-dim: rgba(245,166,35,0.1);
    --blue:     #2F478E; --blue-dim: rgba(47,71,142,0.08);
    --radius:   6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--kb-font-body); font-size: 13px; line-height: 1.6; min-height: 100vh; }

  /* ── Dark chrome: header + footer stay dark, config-driven (--kb-*). ── */
  .topbar, .footer {
    --bg:       var(--kb-bg);
    --surface:  rgba(255,255,255,0.06);
    --surface2: rgba(255,255,255,0.10);
    --border:   var(--kb-border);
    --border2:  var(--kb-border-light);
    --text:     var(--kb-text);
    --muted:    var(--kb-text-muted);
    --dim:      var(--kb-text-faint);
    background: var(--bg);
    color: var(--text);
  }
  .topbar {
    height: 54px; background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; position: sticky; top: 0; z-index: 200;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo { display: inline-flex; line-height: 0; transition: opacity .15s; }
  .brand-logo:hover { opacity: .75; }
  .brand-divider { color: var(--border2); font-size: 16px; }
  .brand-name { font-family: var(--kb-font-heading); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .topnav { display: flex; align-items: center; gap: 4px; }
  .topnav a {
    font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim); text-decoration: none;
    padding: 5px 10px; border-radius: 3px; transition: color .15s, background .15s;
  }
  .topnav a:hover { color: var(--text); background: var(--surface); }
  .topnav a.active { color: var(--red); }
  .topnav-group { display: flex; align-items: center; gap: 2px; }
  .topnav-group + .topnav-group { margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--border); }
  .topnav-group-label {
    font-family: var(--kb-font-mono); font-size: 8px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); padding: 0 6px 0 2px; opacity: .8;
  }
  @media (max-width: 920px) {
    .topnav-group-label { display: none; }
    .topnav-group + .topnav-group { margin-left: 2px; padding-left: 4px; }
  }

  .crumb { max-width: 1080px; margin: 0 auto; padding: 22px 32px 0; }
  .crumb a {
    font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); text-decoration: none;
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 13px;
    transition: color .12s, border-color .12s;
  }
  .crumb a:hover { color: var(--red); border-color: var(--red); }

  .page-head { max-width: 1080px; margin: 0 auto; padding: 44px 32px 0; }
  .page-eyebrow {
    font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .15em;
    text-transform: uppercase; color: var(--red); margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .page-eyebrow-line { width: 40px; height: 1px; background: var(--red); opacity: .5; }
  .page-title { font-family: var(--kb-font-heading); font-size: 40px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; color: var(--text); margin-bottom: 10px; }
  .page-subtitle { font-size: 13px; color: var(--muted); max-width: 640px; line-height: 1.7; }
  .page-meta { font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .08em; color: var(--dim); margin-top: 14px; }
  .page-meta span { color: var(--text); }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 32px 80px; display: flex; flex-direction: column; gap: 32px; }

  .section-head {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px;
    padding-bottom: 9px; border-bottom: 1px solid var(--border);
  }
  .section-title { font-family: var(--kb-font-heading); font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--text); }
  .section-sub { font-family: var(--kb-font-mono); font-size: 10px; color: var(--dim); }

  /* ── Critical path chain ── */
  .cp-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .cp-step {
    display: flex; align-items: center; gap: 12px; padding: 11px 16px;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  }
  .cp-num {
    flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--red-dim);
    color: var(--red); font-family: var(--kb-font-mono); font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .cp-title { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text); }

  /* ── Badges + chips (shared vocabulary with specs/index.html) ── */
  .chip {
    font-family: var(--kb-font-mono); font-size: 9px; letter-spacing: .04em; color: var(--muted);
    background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 2px 7px;
    white-space: nowrap; flex: none;
  }
  .chip.est { color: var(--text); }

  /* ── Size histogram ── */
  .hist { display: flex; flex-direction: column; gap: 8px; }
  .hist-row { display: flex; align-items: center; gap: 12px; }
  .hist-label { flex: none; width: 64px; font-family: var(--kb-font-mono); font-size: 11px; color: var(--muted); text-align: right; }
  .hist-track { flex: 1; height: 16px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .hist-fill { height: 100%; background: var(--red); border-radius: 3px; transition: width .2s ease; }
  .hist-row.unsized .hist-fill { background: var(--dim); }
  .hist-count { flex: none; width: 32px; font-family: var(--kb-font-mono); font-size: 11px; color: var(--text); text-align: right; }

  /* ── Size by feature ── */
  .feat-list { display: flex; flex-direction: column; gap: 8px; }
  .feat-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .feat-row:last-child { border-bottom: none; }
  .feat-label { font-size: 12.5px; color: var(--text); min-width: 160px; }
  .feat-chips { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── Design-gate split ── */
  .gate-split { display: flex; flex-direction: column; gap: 10px; }
  .gate-bar { display: flex; height: 20px; border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
  .gate-bar-pre { background: var(--green-dim); }
  .gate-bar-gated { background: var(--yellow-dim); }
  .gate-legend { display: flex; gap: 20px; flex-wrap: wrap; }
  .gate-legend-item { display: flex; align-items: center; gap: 7px; font-family: var(--kb-font-mono); font-size: 10px; color: var(--muted); }
  .gate-legend-dot { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .gate-legend-dot.pre { background: var(--green); }
  .gate-legend-dot.gated { background: var(--yellow); }

  /* ── States ── */
  .statebox {
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
    padding: 32px 28px; text-align: center; color: var(--muted); font-size: 13px;
  }
  .statebox .st-title { font-family: var(--kb-font-heading); font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--text); margin-bottom: 6px; }
  .statebox.error { border-color: color-mix(in srgb, var(--kb-primary) 40%, transparent); }
  .statebox.error .st-title { color: var(--red); }
  .statebox code { font-family: var(--kb-font-mono); font-size: 12px; color: var(--muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px; }
  .spinner { display: inline-block; width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    border-top: 1px solid var(--border); padding: 20px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .footer-left { display: flex; align-items: center; gap: 16px; }
  .footer-text { font-family: var(--kb-font-mono); font-size: 10px; color: var(--dim); }

  @media (max-width: 560px) {
    .topbar, .page-head, .wrap, .footer { padding-left: 18px; padding-right: 18px; }
    .page-title { font-size: 32px; }
    .feat-label { min-width: 0; width: 100%; }
  }
</style>
<link rel="stylesheet" href="/app/theme.css">
<script src="/app/nav.js" defer></script>
<script src="/app/theme.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <!-- Owner co-brand mark, linked home. Not baked here: app/nav.js fills this
         slot from client.config.json branding.owner (KBNav.applyOwnerBrand),
         falling back to a text wordmark. -->
    <a href="/" class="brand-logo" aria-label="Home" data-kb-owner-mark="24"></a>
    <span class="brand-divider">×</span>
    <span class="brand-name" id="brand-name">—</span>
  </div>
  <nav class="topnav" id="topnav"></nav>
</header>

<nav class="crumb" aria-label="Breadcrumb"><a href="/specs/">← Plan</a></nav>

<section class="page-head">
  <div class="page-eyebrow">
    <span id="page-eyebrow-text">Spec Stats</span>
    <span class="page-eyebrow-line"></span>
  </div>
  <h1 class="page-title">Spec Stats</h1>
  <p class="page-subtitle">Live counts, size distribution, and the critical dependency path — computed from <code>specs/manifest.json</code>, never hand-typed. Same numbers as <code>make spec-stats</code>.</p>
  <div class="page-meta" id="page-meta"><span id="story-count">—</span> stories<span id="generated-meta"></span></div>
</section>

<div class="wrap" id="wrap">
  <div class="statebox">
    <div class="spinner"></div>
    <div class="st-title">Loading</div>
    <div>Fetching the plan stats…</div>
  </div>
</div>

<footer class="footer">
  <div class="footer-left">
    <!-- Owner co-brand mark, from client.config.json branding.owner (app/nav.js). -->
    <span class="footer-mark" data-kb-owner-mark="17"></span>
    <span class="footer-text" id="footer-text">—</span>
  </div>
</footer>

<script>
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── Branding + nav: fetch /client.config.json and re-brand the page ──────────
async function loadConfig() {
  let cfg;
  try {
    cfg = await fetch('/client.config.json', { cache: 'no-cache' }).then(r => r.json());
  } catch (e) { return; }

  const b = cfg.branding || {};
  const colors = b.colors || {};
  const fonts = b.fonts || {};

  const root = document.documentElement.style;
  const setVar = (name, val) => { if (val) root.setProperty(name, val); };
  setVar('--kb-primary',      colors.primary);
  setVar('--kb-link',         colors.link);
  setVar('--kb-accent',       colors.accent);
  setVar('--kb-bg',           colors.bg);
  setVar('--kb-bg-deep',      colors.bgDeep);
  setVar('--kb-surface',      colors.surface);
  setVar('--kb-border',       colors.border);
  setVar('--kb-border-light', colors.borderLight);
  setVar('--kb-text',         colors.text);
  setVar('--kb-text-muted',   colors.textMuted);
  setVar('--kb-text-faint',   colors.textFaint);
  setVar('--kb-font-heading', fonts.heading);
  setVar('--kb-font-body',    fonts.body);
  setVar('--kb-font-mono',    fonts.mono);

  const name = KBNav.brainName(cfg);
  document.title = (name ? name + ' — ' : '') + 'Spec Stats';
  const set = (id, val) => { const el = document.getElementById(id); if (el && val != null) el.textContent = val; };
  set('brand-name', KBNav.brainShortName(cfg));
  set('page-eyebrow-text', name ? name + ' Spec Stats' : 'Spec Stats');
  set('footer-text', [KBNav.brainShortName(cfg), KBNav.ownerName(cfg.branding)].filter(Boolean).join(' · '));

  KBNav.topnav(document.getElementById('topnav'), cfg.pages || []);
}

// ── Spec Stats (reads /specs/stats.json) ─────────────────────────────────────
function critPathHTML(cp) {
  if (!cp.nodes.length) return '';
  const steps = cp.nodes.map((n, i) => `<li class="cp-step">
    <span class="cp-num">${i + 1}</span>
    <span class="cp-title">${esc(n.title)}</span>
    ${n.estimate ? `<span class="chip est">${esc(n.estimate)}</span>` : ''}
  </li>`).join('');
  return `<section>
    <div class="section-head">
      <span class="section-title">Critical Path</span>
      <span class="section-sub">${cp.length} node${cp.length === 1 ? '' : 's'} deep</span>
    </div>
    <ol class="cp-list">${steps}</ol>
  </section>`;
}

function histHTML(dist) {
  const rows = dist.order.filter(k => dist.counts[k]).map(k => ({ label: k, n: dist.counts[k], unsized: false }));
  if (dist.unsized) rows.push({ label: '(unsized)', n: dist.unsized, unsized: true });
  if (!rows.length) return '';
  const max = Math.max(...rows.map(r => r.n));
  const bars = rows.map(r => `<div class="hist-row${r.unsized ? ' unsized' : ''}">
    <span class="hist-label">${esc(r.label)}</span>
    <span class="hist-track"><span class="hist-fill" style="width:${Math.round(r.n / max * 100)}%"></span></span>
    <span class="hist-count">${r.n}</span>
  </div>`).join('');
  return `<section>
    <div class="section-head">
      <span class="section-title">Size Distribution</span>
      <span class="section-sub">relative effort / complexity</span>
    </div>
    <div class="hist">${bars}</div>
  </section>`;
}

function featuresHTML(byFeature) {
  if (!byFeature.length) return '';
  const rows = byFeature.map(f => {
    const chips = Object.entries(f.counts).map(([size, n]) => `<span class="chip">${esc(size)}:${n}</span>`).join('');
    return `<div class="feat-row"><span class="feat-label">${esc(f.label)}</span><span class="feat-chips">${chips}</span></div>`;
  }).join('');
  return `<section>
    <div class="section-head">
      <span class="section-title">Size by Feature</span>
    </div>
    <div class="feat-list">${rows}</div>
  </section>`;
}

function gateHTML(gate, split) {
  let body;
  if (!gate) {
    body = `<div class="statebox">
      <div class="st-title">No gate configured</div>
      <div>Regenerate with <code>python3 scripts/gen-spec-stats.py --gate &lt;id-prefix&gt;</code> to report which stories are gated behind a given epic or phase.</div>
    </div>`;
  } else {
    const total = split.pre_gate + split.gated || 1;
    body = `<div class="gate-split">
      <div class="gate-bar">
        <span class="gate-bar-pre" style="width:${Math.round(split.pre_gate / total * 100)}%"></span>
        <span class="gate-bar-gated" style="width:${Math.round(split.gated / total * 100)}%"></span>
      </div>
      <div class="gate-legend">
        <span class="gate-legend-item"><span class="gate-legend-dot pre"></span>Startable now — ${split.pre_gate}</span>
        <span class="gate-legend-item"><span class="gate-legend-dot gated"></span>Gated behind <code>${esc(gate)}</code> — ${split.gated}</span>
      </div>
    </div>`;
  }
  return `<section>
    <div class="section-head">
      <span class="section-title">Design-Gate Split</span>
    </div>
    ${body}
  </section>`;
}

function render(data) {
  const wrap = document.getElementById('wrap');
  document.getElementById('story-count').textContent = data.stories.total;
  const genMeta = document.getElementById('generated-meta');
  if (genMeta) genMeta.innerHTML = data.generated ? ' · generated <span>' + esc(data.generated) + '</span>' : '';

  if (!data.stories.total) {
    wrap.innerHTML = '<div class="statebox">' +
      '<div class="st-title">No stories yet</div>' +
      '<div>Author the plan as markdown under <code>specs/</code>, then run <code>make specs spec-stats-json</code>.</div>' +
    '</div>';
    return;
  }

  wrap.innerHTML = [
    critPathHTML(data.critical_path),
    histHTML(data.size_distribution),
    featuresHTML(data.size_by_feature),
    gateHTML(data.gate, data.gate_split),
  ].filter(Boolean).join('');
}

async function loadStats() {
  const wrap = document.getElementById('wrap');
  let data;
  try {
    const r = await fetch('/specs/stats.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch (err) {
    wrap.innerHTML = '<div class="statebox error">' +
      '<div class="st-title">Failed to load</div>' +
      '<div>Could not fetch <code>specs/stats.json</code> (' + esc(err.message) + ').</div>' +
      '<div style="margin-top:10px">Run <code>make spec-stats-json</code> to generate it.</div>' +
    '</div>';
    return;
  }
  render(data);
}

loadConfig();
loadStats();
</script>
</body>
</html>
