# The portal container's nginx (#459): the published asset set, /health, and
# /mcp proxied to the brain's MCP endpoint on loopback. Runs as a non-root user,
# so every writable path is under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    # The default format logs the request line and status, never a header, so
    # the brain token in X-Astrolift-Brain-Token never reaches a log.
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /srv/brain;
        index index.html;
        absolute_redirect off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The startup script writes only the fixed native App routes here when
        # BRAIN_PORTAL_NATIVE_APPS=1; the default file is empty.
        include /tmp/native-app-routes.conf;

        # scripts/brain_mcp.py; it checks the token, the origin and the body itself.
        location = /mcp {
            client_max_body_size 64k;
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            # The headers above already cover these; drop the endpoint's copies.
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
        }

        # The chat bubble's /api/chat is a Cloudflare Worker feature; fail it cleanly.
        location /api/ {
            default_type application/json;
            return 503 '{"error":"chat is not served on this host"}';
        }

        # The Python host checks every published path per request, scrubs
        # access config/artifacts and serves the same asset tree as nginx did.
        # Identity headers are only trusted when the host explicitly selects
        # the edge contract and injects its unguessable assertion secret.
        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }
    }
}
