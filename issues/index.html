<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issues</title>
<style>
  :root {
    /* ── Branding seam: defaults below are overwritten at runtime from
       /client.config.json (branding.colors + branding.fonts). The page renders
       immediately with these values, then re-brands when the config loads. ── */
    --kb-primary:      #1E9C8F;
    --kb-link:         #2F97BF;
    --kb-accent:       #B98536;
    --kb-bg:           #0B1619;
    --kb-bg-deep:      #060D0F;
    --kb-surface:      #0F1E22;
    --kb-border:       #1D3238;
    --kb-border-light: #27414A;
    --kb-text:         #E6EFEE;
    --kb-text-muted:   #93A9AB;
    --kb-text-faint:   #667D80;
    --kb-font-heading: 'Fraunces', Georgia, serif;
    --kb-font-body:    'Inter', system-ui, sans-serif;
    --kb-font-mono:    'JetBrains Mono', monospace;

    /* Local aliases — the source stylesheet rules reference these short names.
       They resolve to the --kb-* seam so a single config fetch re-brands all. */
    --bg:       var(--kb-bg);
    --surface:  rgba(255,255,255,0.05);
    --surface2: rgba(255,255,255,0.08);
    --border:   var(--kb-border);
    --border2:  var(--kb-border-light);
    --red:      var(--kb-primary);
    --red-dim:  color-mix(in srgb, var(--kb-primary) 10%, transparent);
    --red-dark: #9C2633;
    --text:     var(--kb-text);
    --muted:    var(--kb-text-muted);
    --dim:      var(--kb-text-faint);
    --green:    var(--kb-accent); --green-dim: rgba(76,175,80,0.1);
    --yellow:   #F5A623; --yellow-dim: rgba(245,166,35,0.08);
    --blue:     var(--kb-link); --blue-dim: rgba(74,127,165,0.1);
    --purple:   #7A5BA8; --purple-dim: rgba(122,91,168,0.1);
    --radius:   6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--kb-font-body); font-size: 13px; line-height: 1.6; min-height: 100vh; }

  /* ── Topbar ── */
  .topbar {
    height: 54px; background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; position: sticky; top: 0; z-index: 200;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo { display: inline-flex; line-height: 0; transition: opacity .15s; }
  .brand-logo:hover { opacity: .75; }
  .brand-divider { color: var(--border2); font-size: 16px; }
  .brand-name { font-family: var(--kb-font-heading); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .topnav { display: flex; align-items: center; gap: 4px; }
  .topnav a {
    font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim); text-decoration: none;
    padding: 5px 10px; border-radius: 3px; transition: color .15s, background .15s;
  }
  .topnav a:hover { color: var(--text); background: var(--surface); }
  .topnav a.active { color: var(--red); }
  /* Grouped top-nav: each config `group` becomes a labeled segment. */
  .topnav-group { display: flex; align-items: center; gap: 2px; }
  .topnav-group + .topnav-group { margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--border); }
  .topnav-group-label {
    font-family: var(--kb-font-mono); font-size: 8px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); padding: 0 6px 0 2px; opacity: .8;
  }
  @media (max-width: 920px) {
    .topnav-group-label { display: none; }
    .topnav-group + .topnav-group { margin-left: 2px; padding-left: 4px; }
  }
  /* ── Breadcrumb back-to-home (matches reader.html / session.html) ── */
  .crumb { max-width: 1500px; margin: 0 auto; padding: 22px 32px 0; }
  .crumb a {
    font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); text-decoration: none;
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 13px;
    transition: color .12s, border-color .12s;
  }
  .crumb a:hover { color: var(--red); border-color: var(--red); }

  /* ── Page head ── */
  .page-head { max-width: 1080px; margin: 0 auto; padding: 44px 32px 0; }
  .page-eyebrow {
    font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .15em;
    text-transform: uppercase; color: var(--red); margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .page-eyebrow-line { width: 40px; height: 1px; background: var(--red); opacity: .5; }
  .page-title { font-family: var(--kb-font-heading); font-size: 40px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; color: var(--text); margin-bottom: 10px; }
  .page-subtitle { font-size: 13px; color: var(--muted); max-width: 620px; line-height: 1.7; }
  .page-meta { font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .08em; color: var(--dim); margin-top: 14px; }
  .page-meta span { color: var(--text); }

  /* ── Tabs (project filter) ── */
  .tabbar {
    max-width: 1080px; margin: 28px auto 0; padding: 0 32px;
    display: flex; flex-wrap: wrap; gap: 6px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim); background: none;
    border: none; border-bottom: 2px solid transparent; cursor: pointer;
    padding: 8px 12px 9px; transition: color .15s, border-color .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--red); border-bottom-color: var(--red); }
  .tab-count { color: var(--dim); }
  .tab.active .tab-count { color: var(--red); }

  /* ── List / Board view toggle ── */
  .view-toggle { max-width: 1080px; margin: 14px auto -8px; padding: 0 32px; display: flex; justify-content: flex-end; gap: 4px; }
  .vt-btn {
    font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--dim); background: var(--surface); border: 1px solid var(--border); cursor: pointer; padding: 5px 12px;
    transition: color .15s, border-color .15s;
  }
  .vt-btn:hover { color: var(--text); }
  .vt-btn.active { color: var(--red); border-color: var(--red); }

  /* ── Body ── */
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 32px 80px; }

  /* ── Status groups ── */
  .group { margin-bottom: 30px; }
  .group-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    padding-bottom: 9px; border-bottom: 1px solid var(--border);
  }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .group-title { font-family: var(--kb-font-heading); font-size: 16px; letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
  .group-count { font-family: var(--kb-font-mono); font-size: 10px; color: var(--dim); margin-left: auto; white-space: nowrap; }

  /* ── Issue rows ── */
  .issue-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .issue-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    border-left: 3px solid var(--s-color, var(--dim)); padding: 11px 14px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .issue-top { display: flex; align-items: flex-start; gap: 10px; }
  .issue-title { font-size: 13.5px; color: var(--text); line-height: 1.45; text-decoration: none; flex: 1; }
  .issue-title:hover { color: var(--red); }
  .issue-num { font-family: var(--kb-font-mono); font-size: 11px; color: var(--muted); margin-right: 6px; white-space: nowrap; }
  .status-badge {
    font-family: var(--kb-font-mono); font-size: 9px; font-weight: 500; white-space: nowrap;
    text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 3px;
    border: 1px solid var(--s-color); color: var(--s-color); background: var(--s-dim);
  }
  .issue-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .pill {
    font-family: var(--kb-font-mono); font-size: 9px; font-weight: 500; white-space: nowrap;
    text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 3px;
    color: var(--muted); background: var(--surface2); border: 1px solid var(--border);
  }
  .pill.repo { color: var(--red); background: var(--red-dim); border-color: var(--red-dim); }
  .pill.project { color: var(--blue); background: var(--blue-dim); border-color: var(--blue-dim); }
  .issue-assignees { font-family: var(--kb-font-mono); font-size: 10px; color: var(--dim); margin-left: auto; }

  /* status palettes (set --s-color + --s-dim per status, keyed off a slug).
     Derived generically from whatever status strings appear in issues.json;
     unrecognized statuses fall through to .s-no-status. */
  .s-in-progress { --s-color: var(--blue);   --s-dim: var(--blue-dim); }
  .s-in-review   { --s-color: var(--purple); --s-dim: var(--purple-dim); }
  .s-todo        { --s-color: var(--yellow); --s-dim: var(--yellow-dim); }
  .s-backlog     { --s-color: var(--muted);  --s-dim: var(--surface2); }
  .s-done        { --s-color: var(--green);  --s-dim: var(--green-dim); }
  .s-no-status   { --s-color: var(--dim);    --s-dim: var(--surface2); }

  /* ── Kanban board ── */
  .board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
  .board-col { flex: 1 0 220px; min-width: 220px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); }
  .board-col-head {
    font-family: var(--kb-font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--s-color, var(--muted)); padding: 10px 12px; border-bottom: 2px solid var(--s-color, var(--border));
    display: flex; align-items: center; gap: 7px;
  }
  .board-col-count { margin-left: auto; color: var(--dim); }
  .board-col-body { padding: 8px; display: flex; flex-direction: column; gap: 7px; max-height: 72vh; overflow-y: auto; }
  .board-card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 9px 10px; text-decoration: none; color: inherit; transition: border-color .12s; }
  .board-card:hover { border-color: var(--s-color, var(--red)); }
  .bc-num { font-family: var(--kb-font-mono); font-size: 10px; color: var(--muted); }
  .bc-title { font-size: 12px; color: var(--text); line-height: 1.4; margin-top: 3px; }
  .bc-labels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

  /* ── Pager ── */
  .pager {
    margin-top: 28px;
    display: flex; align-items: center; justify-content: center; gap: 16px;
  }
  .pager-btn {
    font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: 3px; padding: 6px 14px; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .pager-btn:hover:not(:disabled) { color: var(--red); border-color: var(--red); background: var(--surface2); }
  .pager-btn:disabled { color: var(--dim); cursor: default; opacity: .5; }
  .pager-status { font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .08em; color: var(--muted); }
  .pager-status span { color: var(--text); }

  /* ── States ── */
  .statebox, .errorbox {
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
    padding: 44px 28px; text-align: center; color: var(--muted); font-size: 13px;
  }
  .st-title { font-family: var(--kb-font-heading); font-size: 18px; letter-spacing: .1em; text-transform: uppercase; color: var(--text); margin-bottom: 6px; }
  .errorbox { border-color: var(--red); }
  .errorbox .st-title { color: var(--red); }
  .statebox code, .errorbox code { font-family: var(--kb-font-mono); font-size: 12px; color: var(--muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px; }
  .spinner { display: inline-block; width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Footer ── */
  .footer {
    border-top: 1px solid var(--border); padding: 20px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .footer-left { display: flex; align-items: center; gap: 16px; }
  .footer-text { font-family: var(--kb-font-mono); font-size: 10px; color: var(--dim); }

  @media (max-width: 560px) {
    .topbar, .page-head, .tabbar, .view-toggle, .wrap, .footer { padding-left: 18px; padding-right: 18px; }
    .page-title { font-size: 32px; }
    .group-count { margin-left: 0; }
    .issue-assignees { margin-left: 0; }
  }
</style>
<!-- Shared light/dark theme: overrides the local alias vars per theme (loaded
     AFTER the page's own <style> so its higher-specificity rules win) and
     injects the toggle into .topbar. theme.js owns all toggle logic. -->
<link rel="stylesheet" href="/app/theme.css">
<script src="/app/nav.js" defer></script>
<script src="/app/theme.js" defer></script>
</head>
<body>

<!-- Topbar -->
<header class="topbar">
  <div class="brand">
    <!-- Owner co-brand mark, linked home. The mark itself is NOT baked here:
         app/nav.js fills this slot from client.config.json branding.owner
         (KBNav.applyOwnerBrand), falling back to a text wordmark. -->
    <a href="/" class="brand-logo" aria-label="Home" data-kb-owner-mark="24"></a>
    <span class="brand-divider">×</span>
    <span class="brand-name" id="brand-name">—</span>
  </div>
  <nav class="topnav" id="topnav"></nav>
</header>

<!-- Page head -->
<nav class="crumb" aria-label="Breadcrumb"><a href="/">← Portal home</a></nav>

<section class="page-head">
  <div class="page-eyebrow">
    <span id="page-eyebrow-text">Issues</span>
    <span class="page-eyebrow-line"></span>
  </div>
  <h1 class="page-title">Issues</h1>
  <p class="page-subtitle">Open issues across the project repos, grouped by board status. Filter by project; click any issue to open it on GitHub.</p>
  <div class="page-meta" id="page-meta"><span id="open-count">—</span> open issues · updated <span id="updated">—</span></div>
</section>

<!-- Project filter tabs -->
<nav class="tabbar" id="tabbar" role="tablist" aria-label="Filter issues by project"></nav>

<!-- List / Board view toggle -->
<div class="view-toggle" id="view-toggle" hidden>
  <button class="vt-btn active" type="button" data-view="list">List</button>
  <button class="vt-btn" type="button" data-view="board">Board</button>
</div>

<!-- Body -->
<div class="wrap">
  <div id="results">
    <div class="statebox">
      <div class="spinner"></div>
      <div class="st-title">Loading</div>
      <div>Fetching issues…</div>
    </div>
  </div>

  <nav class="pager" id="pager" aria-label="Pagination" hidden></nav>
</div>

<!-- Footer -->
<footer class="footer">
  <div class="footer-left">
    <!-- Owner co-brand mark, from client.config.json branding.owner (app/nav.js). -->
    <span class="footer-mark" data-kb-owner-mark="17"></span>
    <span class="footer-text" id="footer-text">—</span>
  </div>
</footer>

<script>
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── Branding + nav: fetch /client.config.json and re-brand the page ──────────
async function loadConfig() {
  let cfg;
  try {
    cfg = await fetch('/client.config.json', { cache: 'no-cache' }).then(r => r.json());
  } catch (e) { return; }

  const b = cfg.branding || {};
  const colors = b.colors || {};
  const fonts = b.fonts || {};
  const client = cfg.client || {};

  // CSS custom properties → re-brand colors + fonts.
  const root = document.documentElement.style;
  const setVar = (name, val) => { if (val) root.setProperty(name, val); };
  setVar('--kb-primary',      colors.primary);
  setVar('--kb-link',         colors.link);
  setVar('--kb-accent',       colors.accent);
  setVar('--kb-bg',           colors.bg);
  setVar('--kb-bg-deep',      colors.bgDeep);
  setVar('--kb-surface',      colors.surface);
  setVar('--kb-border',       colors.border);
  setVar('--kb-border-light', colors.borderLight);
  setVar('--kb-text',         colors.text);
  setVar('--kb-text-muted',   colors.textMuted);
  setVar('--kb-text-faint',   colors.textFaint);
  setVar('--kb-font-heading', fonts.heading);
  setVar('--kb-font-body',    fonts.body);
  setVar('--kb-font-mono',    fonts.mono);

  // Document title: "<client.name> — Issues".
  const name = client.name || client.shortName || '';
  document.title = (name ? name + ' — ' : '') + 'Issues';
  const set = (id, val) => { const el = document.getElementById(id); if (el && val != null) el.textContent = val; };
  set('brand-name', client.shortName || client.name || '');
  set('page-eyebrow-text', name ? name + ' Issues' : 'Issues');
  // Owner co-brand (#47): the owner name comes from branding.owner through
  // the shared seam in app/nav.js, never a literal in the page shell.
  set('footer-text', [client.shortName || client.name, KBNav.ownerName(cfg.branding)].filter(Boolean).join(' · '));

  buildNav(cfg.pages || []);
}

function buildNav(pages) {
  // Grouped top-nav + active-state come from the shared module so nav logic
  // can't drift between pages. See app/nav.js.
  KBNav.topnav(document.getElementById('topnav'), pages);
}

// ── Issues board (reads /issues.json) ────────────────────────────────────────
// Schema (scripts/gen-issues.py): { projects:[…], repos:[{ repo, open:[{ number,
// title, url, labels[], assignees[], status, project, updatedAt }] }] }. Every
// grouping/filter below is derived from those fields — no client names, no
// hardcoded projects, no hardcoded counts.
const PER_PAGE = 50;
const PROJECT_ALL = '__all__', NO_PROJECT = '__none__';
// Preferred display order for board status columns. Any status not listed here
// (custom board columns) is appended alphabetically, so unknown statuses still
// render — this list is an ordering hint, not an allow-list.
const STATUS_ORDER = ['In Progress', 'In Review', 'Todo', 'Backlog', 'No status', 'Done'];
const state = { issues: [], tab: PROJECT_ALL, page: 1, tabs: [], view: 'list', hasProjects: false };

// Map an arbitrary status string to a CSS class. Known statuses get a themed
// palette (see .s-* rules); anything else still gets a stable slug class and
// inherits the neutral default via the .issue-item fallback.
function statusSlug(s) { return 's-' + String(s || 'No status').toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

function issuesForTab(tab) {
  if (tab === PROJECT_ALL) return state.issues;
  if (tab === NO_PROJECT) return state.issues.filter(i => !i.project);
  return state.issues.filter(i => i.project === tab);
}

// Build the project filter tabs from the union of issue.project values. "All"
// first, then each project alphabetically, then a "No board" bucket if any
// issue lacks a project. Entirely data-driven — empty when no boards exist.
function buildTabList() {
  const seen = Array.from(new Set(state.issues.map(i => i.project).filter(Boolean)))
    .sort((a, b) => a.localeCompare(b));
  const tabs = [{ id: PROJECT_ALL, label: 'All' }].concat(seen.map(p => ({ id: p, label: p })));
  if (seen.length && state.issues.some(i => !i.project)) tabs.push({ id: NO_PROJECT, label: 'No board' });
  return tabs;
}

function renderTabs() {
  const bar = document.getElementById('tabbar');
  // Only show tabs when there is more than one bucket to choose between.
  if (state.tabs.length <= 1) { bar.innerHTML = ''; bar.style.display = 'none'; return; }
  bar.style.display = '';
  bar.innerHTML = state.tabs.map(t => {
    const active = t.id === state.tab;
    const count = issuesForTab(t.id).length;
    return '<button class="tab' + (active ? ' active' : '') + '" type="button" role="tab"' +
      ' aria-selected="' + (active ? 'true' : 'false') + '" data-tab="' + esc(t.id) + '">' +
      esc(t.label) + ' <span class="tab-count">(' + count + ')</span></button>';
  }).join('');
}

// Flatten the active set grouped by status, ordered by STATUS_ORDER then any
// extra statuses alphabetically. Carries each status's full count so headers
// stay accurate when a group is split across pages.
function filteredFlat() {
  const list = issuesForTab(state.tab);
  const groups = {};
  list.forEach(i => { (groups[i.status] = groups[i.status] || []).push(i); });
  const known = STATUS_ORDER.filter(s => groups[s]);
  const extra = Object.keys(groups).filter(s => STATUS_ORDER.indexOf(s) === -1).sort();
  const order = known.concat(extra);
  const flat = [], counts = {};
  order.forEach(s => { counts[s] = groups[s].length; groups[s].forEach(i => flat.push({ key: s, item: i })); });
  return { flat, counts };
}

function groupHead(status, total) {
  return '<div class="group-head ' + statusSlug(status) + '">' +
    '<span class="status-dot" style="background:var(--s-color)"></span>' +
    '<span class="group-title">' + esc(status) + '</span>' +
    '<span class="group-count">' + total + (total === 1 ? ' issue' : ' issues') + '</span>' +
  '</div>';
}

function issueHTML(it) {
  const labels = (it.labels || []).map(l => '<span class="pill">' + esc(l) + '</span>').join('');
  // Project pill only when issues carry boards; the repo pill always shows.
  const projectPill = it.project ? '<span class="pill project">' + esc(it.project) + '</span>' : '';
  const assignees = (it.assignees || []).length ? '@' + it.assignees.join(' @') : '';
  return '<li class="issue-item ' + statusSlug(it.status) + '">' +
    '<div class="issue-top">' +
      '<a class="issue-title" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
        '<span class="issue-num">' + esc(it.repoShort) + ' #' + esc(it.number) + '</span>' + esc(it.title) +
      '</a>' +
      '<span class="status-badge">' + esc(it.status) + '</span>' +
    '</div>' +
    '<div class="issue-foot">' +
      '<span class="pill repo">' + esc(it.repoShort) + '</span>' + projectPill + labels +
      (assignees ? '<span class="issue-assignees">' + esc(assignees) + '</span>' : '') +
    '</div>' +
  '</li>';
}

function renderPager(totalPages) {
  const pager = document.getElementById('pager');
  if (totalPages <= 1) { pager.hidden = true; pager.innerHTML = ''; return; }
  pager.hidden = false;
  const page = state.page;
  pager.innerHTML =
    '<button class="pager-btn" type="button" data-nav="prev"' + (page <= 1 ? ' disabled' : '') + '>Prev</button>' +
    '<span class="pager-status">Page <span>' + page + '</span> of <span>' + totalPages + '</span></span>' +
    '<button class="pager-btn" type="button" data-nav="next"' + (page >= totalPages ? ' disabled' : '') + '>Next</button>';
}

// Kanban board — one column per status, read-only cards linking to GitHub.
function boardCard(it) {
  const labels = (it.labels || []).slice(0, 3).map(l => '<span class="pill">' + esc(l) + '</span>').join('');
  return '<a class="board-card" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
    '<div class="bc-num">' + esc(it.repoShort) + ' #' + esc(it.number) + '</div>' +
    '<div class="bc-title">' + esc(it.title) + '</div>' +
    (labels ? '<div class="bc-labels">' + labels + '</div>' : '') + '</a>';
}
function renderBoard() {
  const list = issuesForTab(state.tab);
  const groups = {};
  list.forEach(i => { (groups[i.status] = groups[i.status] || []).push(i); });
  const order = STATUS_ORDER.filter(s => groups[s])
    .concat(Object.keys(groups).filter(s => STATUS_ORDER.indexOf(s) === -1).sort());
  return '<div class="board">' + order.map(s =>
    '<div class="board-col ' + statusSlug(s) + '">' +
      '<div class="board-col-head"><span class="status-dot" style="background:var(--s-color)"></span>' +
        esc(s) + '<span class="board-col-count">' + groups[s].length + '</span></div>' +
      '<div class="board-col-body">' + groups[s].map(boardCard).join('') + '</div>' +
    '</div>').join('') + '</div>';
}

function render() {
  const resultsEl = document.getElementById('results');
  renderTabs();
  const { flat, counts } = filteredFlat();
  if (!flat.length) {
    resultsEl.innerHTML = '<div class="statebox"><div class="st-title">No issues</div><div>No open issues match this filter.</div></div>';
    renderPager(1);
    return;
  }
  if (state.view === 'board') {
    resultsEl.innerHTML = renderBoard();
    renderPager(1);
    return;
  }
  const totalPages = Math.max(1, Math.ceil(flat.length / PER_PAGE));
  if (state.page > totalPages) state.page = totalPages;
  const start = (state.page - 1) * PER_PAGE;
  const pageItems = flat.slice(start, start + PER_PAGE);
  // Walk the page slice, opening a new status section whenever the group
  // changes. Group counts reflect the full filtered set (counts[...]).
  let html = '', openKey = null;
  pageItems.forEach(row => {
    if (row.key !== openKey) {
      if (openKey !== null) html += '</ul></section>';
      html += '<section class="group">' + groupHead(row.item.status, counts[row.key]) + '<ul class="issue-list">';
      openKey = row.key;
    }
    html += issueHTML(row.item);
  });
  if (openKey !== null) html += '</ul></section>';
  resultsEl.innerHTML = html;
  renderPager(totalPages);
}

// Tab clicks → switch project filter, reset to page 1.
document.getElementById('tabbar').addEventListener('click', e => {
  const btn = e.target.closest('.tab'); if (!btn) return;
  const tab = btn.getAttribute('data-tab'); if (tab === state.tab) return;
  state.tab = tab; state.page = 1; render();
});
// View toggle → list ⇄ board.
document.getElementById('view-toggle').addEventListener('click', e => {
  const btn = e.target.closest('.vt-btn'); if (!btn) return;
  const v = btn.getAttribute('data-view'); if (v === state.view) return;
  state.view = v; state.page = 1;
  document.querySelectorAll('#view-toggle .vt-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
});
// Pager clicks → step a page.
document.getElementById('pager').addEventListener('click', e => {
  const btn = e.target.closest('.pager-btn'); if (!btn || btn.disabled) return;
  const nav = btn.getAttribute('data-nav');
  if (nav === 'prev') state.page--; else if (nav === 'next') state.page++;
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
});

async function loadIssues() {
  const resultsEl = document.getElementById('results');
  let data;
  try {
    const r = await fetch('/issues.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch (err) {
    resultsEl.innerHTML = '<div class="errorbox"><div class="st-title">Failed to load</div>' +
      'Could not fetch <code>issues.json</code> (' + esc(err.message) + ').</div>';
    document.getElementById('open-count').textContent = '0';
    return;
  }

  // Flatten repos[].open[] into one list, carrying a short repo name for display.
  const issues = [];
  let latest = '';
  (data.repos || []).forEach(r => {
    (r.open || []).forEach(i => {
      if (i.updatedAt && i.updatedAt > latest) latest = i.updatedAt;
      issues.push({
        repo: r.repo, repoShort: String(r.repo || '').split('/').pop(),
        number: i.number, title: i.title, url: i.url,
        labels: i.labels || [], assignees: i.assignees || [],
        status: i.status || 'No status', project: i.project || null,
      });
    });
  });

  document.getElementById('open-count').textContent = issues.length;
  document.getElementById('updated').textContent = latest ? latest.slice(0, 10) : '—';

  if (!issues.length) {
    // Empty skeleton (a fresh client, or `make issues` not yet run).
    resultsEl.innerHTML = '<div class="statebox">' +
      '<div class="st-title">No issues yet</div>' +
      '<div>No issues to show. Configure repos under <code>issues.repos</code> in <code>client.config.json</code>, then run <code>make issues</code>.</div>' +
    '</div>';
    return;
  }

  state.issues = issues;
  state.tabs = buildTabList();
  state.tab = PROJECT_ALL;
  state.page = 1;
  // The board view only adds value when issues carry board statuses; otherwise
  // everything would land in a single "No status" column, so hide the toggle.
  state.hasProjects = issues.some(i => i.project);
  document.getElementById('view-toggle').hidden = !state.hasProjects;
  render();
}

loadConfig();
loadIssues();
</script>
</body>
</html>
