<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library</title>
<style>
  :root {
    /* ── Branding seam: defaults below are overwritten at runtime from
       /client.config.json (branding.colors + branding.fonts). The page renders
       immediately with these values, then re-brands when the config loads. ── */
    --kb-primary:      #3A53A4;
    --kb-link:         #7C92D6;
    --kb-accent:       #B98536;
    --kb-bg:           #0B1619;
    --kb-bg-deep:      #060D0F;
    --kb-surface:      #0F1E22;
    --kb-border:       #1D3238;
    --kb-border-light: #27414A;
    --kb-text:         #E6EFEE;
    --kb-text-muted:   #93A9AB;
    --kb-text-faint:   #667D80;
    --kb-font-heading: 'Fraunces', Georgia, serif;
    --kb-font-body:    'Inter', system-ui, sans-serif;
    --kb-font-mono:    'JetBrains Mono', monospace;

    /* Local aliases — the source stylesheet rules reference these short names.
       They resolve to the --kb-* seam so a single config fetch re-brands all. */
    /* ── Content zone: light surfaces with primary-color accents. The dark
       dark portal chrome (header/footer) re-scopes these below. ── */
    --bg:       #F4F5F8;
    --surface:  #FFFFFF;
    --surface2: #EDEFF5;
    --border:   #E2E8F0;
    --border2:  #D7DEEC;
    --red:      var(--kb-primary);
    --red-dim:  rgba(58, 83, 164,0.08);
    --red-dark: #2F478E;
    --text:     #231F20;
    --muted:    #56575D;
    --dim:      #86868B;
    --green:    #1BA15E; --green-dim: rgba(27,161,94,0.1);
    --yellow:   #B5870E; --yellow-dim: rgba(245,166,35,0.1);
    --blue:     #2F478E; --blue-dim: rgba(47,71,142,0.08);
    --purple:   #6B46C1; --purple-dim: rgba(107,70,193,0.1);
    --radius:   6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--kb-font-body); font-size: 13px; line-height: 1.6; min-height: 100vh; }

  /* ── Dark portal chrome: header + footer stay dark, config-driven (--kb-*). ── */
  .topbar, .footer {
    --bg:       var(--kb-bg);
    --surface:  rgba(255,255,255,0.06);
    --surface2: rgba(255,255,255,0.10);
    --border:   var(--kb-border);
    --border2:  var(--kb-border-light);
    --text:     var(--kb-text);
    --muted:    var(--kb-text-muted);
    --dim:      var(--kb-text-faint);
    background: var(--bg);
    color: var(--text);
  }

  /* ── Topbar ── */
  .topbar {
    height: 54px; background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; position: sticky; top: 0; z-index: 200;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo { display: inline-flex; line-height: 0; transition: opacity .15s; }
  .brand-logo:hover { opacity: .75; }
  .brand-divider { color: var(--border2); font-size: 16px; }
  .brand-name { font-family: var(--kb-font-heading); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .topnav { display: flex; align-items: center; gap: 4px; }
  .topnav a {
    font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim); text-decoration: none;
    padding: 5px 10px; border-radius: 3px; transition: color .15s, background .15s;
  }
  .topnav a:hover { color: var(--text); background: var(--surface); }
  .topnav a.active { color: var(--red); }
  /* Grouped top-nav: each config `group` becomes a labeled segment. */
  .topnav-group { display: flex; align-items: center; gap: 2px; }
  .topnav-group + .topnav-group { margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--border); }
  .topnav-group-label {
    font-family: var(--kb-font-mono); font-size: 8px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); padding: 0 6px 0 2px; opacity: .8;
  }
  @media (max-width: 920px) {
    .topnav-group-label { display: none; }
    .topnav-group + .topnav-group { margin-left: 2px; padding-left: 4px; }
  }
  /* ── Breadcrumb back-to-home (matches reader.html / session.html) ── */
  .crumb { max-width: 1500px; margin: 0 auto; padding: 22px 32px 0; }
  .crumb a {
    font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); text-decoration: none;
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 13px;
    transition: color .12s, border-color .12s;
  }
  .crumb a:hover { color: var(--red); border-color: var(--red); }

  /* ── Page head ── */
  .page-head { max-width: 1240px; margin: 0 auto; padding: 44px 32px 0; }
  .page-eyebrow {
    font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .15em;
    text-transform: uppercase; color: var(--red); margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .page-eyebrow-line { width: 40px; height: 1px; background: var(--red); opacity: .5; }
  .page-title { font-family: var(--kb-font-heading); font-size: 40px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; color: var(--text); margin-bottom: 10px; }
  .page-subtitle { font-size: 13px; color: var(--muted); max-width: 620px; line-height: 1.7; }
  .page-meta { font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .08em; color: var(--dim); margin-top: 14px; }
  .page-meta span { color: var(--text); }

  /* ── Body ── */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 32px 80px; }

  /* ── Search ── */
  .search-wrap { position: relative; margin-bottom: 32px; }
  .search-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-family: var(--kb-font-body); font-size: 13px;
    padding: 11px 14px 11px 38px; outline: none; transition: border-color .12s;
  }
  .search-input::placeholder { color: var(--dim); }
  .search-input:focus { border-color: var(--red); }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; opacity: .4; pointer-events: none; }
  .search-clear {
    position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    font-family: var(--kb-font-mono); font-size: 10px; color: var(--dim); background: var(--surface2);
    border: 1px solid var(--border); border-radius: 3px; padding: 2px 7px; cursor: pointer; display: none;
  }
  .search-clear:hover { color: var(--muted); }
  .search-clear.show { display: block; }

  /* ── Groups ── */
  .group { margin-bottom: 34px; }
  .group-head {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px;
    padding-bottom: 9px; border-bottom: 1px solid var(--border);
  }
  .group-title { font-family: var(--kb-font-heading); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--text); }
  .group-count { font-family: var(--kb-font-mono); font-size: 10px; color: var(--dim); }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .doc-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 15px 17px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 8px;
    transition: border-color .12s, background .12s; min-height: 84px;
  }
  .doc-card:hover { border-color: rgba(58, 83, 164,.5); background: var(--surface2); }
  .doc-card-title { font-family: var(--kb-font-body); font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.35; }
  .doc-card:hover .doc-card-title { color: var(--red); }
  .doc-card-summary { font-size: 12px; color: var(--muted); line-height: 1.55; flex: 1; }
  .doc-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
  .badge {
    font-family: var(--kb-font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: .06em;
    padding: 2px 7px; border-radius: 3px; border: 1px solid; white-space: nowrap;
  }
  .badge-wiki     { color: var(--blue);   border-color: rgba(124, 146, 214,.4); background: var(--blue-dim); }
  .badge-analyses { color: var(--purple); border-color: rgba(122,91,168,.4); background: var(--purple-dim); }
  .badge-docs     { color: var(--yellow); border-color: rgba(245,166,35,.4); background: var(--yellow-dim); }
  .badge-memory   { color: var(--green);  border-color: rgba(76,175,80,.4);  background: var(--green-dim); }
  .badge-trackers { color: var(--muted);  border-color: var(--border2);      background: var(--surface2); }
  .doc-card-ext { font-family: var(--kb-font-mono); font-size: 9px; color: var(--dim); }

  /* ── Pager ── */
  .pager {
    margin-top: 28px;
    display: flex; align-items: center; justify-content: center; gap: 16px;
  }
  .pager-btn {
    font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: 3px; padding: 6px 14px; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .pager-btn:hover:not(:disabled) { color: var(--red); border-color: rgba(58, 83, 164,.5); background: var(--surface2); }
  .pager-btn:disabled { color: var(--dim); cursor: default; opacity: .5; }
  .pager-status { font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .08em; color: var(--muted); }
  .pager-status span { color: var(--text); }

  /* ── Categories (browse) ── docs-manifest.json: sections → groups → docs.
     Collapsible; sits above the flat search so you can browse OR search. ── */
  .cats { margin-bottom: 30px; }
  .cats-head {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px;
    padding-bottom: 9px; border-bottom: 1px solid var(--border);
  }
  .cats-title { font-family: var(--kb-font-heading); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--text); }
  .cats-sub { font-family: var(--kb-font-mono); font-size: 10px; color: var(--dim); }
  .cat { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin-bottom: 10px; overflow: hidden; }
  .cat-summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
    padding: 13px 16px; user-select: none; transition: background .12s;
  }
  .cat-summary::-webkit-details-marker { display: none; }
  .cat-summary:hover { background: var(--surface2); }
  .cat-caret { width: 9px; height: 9px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; flex: none; margin-top: -2px; }
  details[open] > .cat-summary .cat-caret { transform: rotate(45deg); }
  .cat-label { font-family: var(--kb-font-body); font-size: 13px; font-weight: 500; color: var(--text); }
  .cat-count { font-family: var(--kb-font-mono); font-size: 10px; color: var(--dim); margin-left: auto; }
  .cat-desc { font-size: 11px; color: var(--muted); margin: 0 16px 4px 35px; line-height: 1.5; }
  .cat-body { padding: 4px 16px 16px 16px; }
  .cat-group + .cat-group { margin-top: 14px; }
  .cat-group-label {
    font-family: var(--kb-font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin: 6px 0 9px; padding-left: 19px;
  }
  .cat-doc {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 19px;
    text-decoration: none; color: inherit; border-radius: 4px; transition: background .12s;
  }
  .cat-doc:hover { background: var(--surface2); }
  .cat-doc-title { font-size: 12.5px; color: var(--text); line-height: 1.35; }
  .cat-doc:hover .cat-doc-title { color: var(--red); }
  .cat-doc-date { font-family: var(--kb-font-mono); font-size: 9px; color: var(--dim); white-space: nowrap; }

  /* ── Shelf grid (#48): sections laid out as cards; the open one spans full
     width so its doc list isn't cramped in a grid cell. Reuses .cat/.cat-summary/
     .cat-body verbatim — same accessible <details> disclosure, new arrangement. ── */
  .shelf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; align-items: start; }
  .cat[open] { grid-column: 1 / -1; }
  .cat:hover { border-color: var(--red); }

  /* ── Per-doc metadata chips: doc-type (extension) + reading time, alongside
     the existing updated date. Additive to .cat-doc / docRow(). ── */
  .cat-doc-meta { display: flex; align-items: center; gap: 7px; margin-left: auto; flex: none; }
  .chip-ext, .chip-time { font-family: var(--kb-font-mono); font-size: 9px; color: var(--dim); white-space: nowrap; }

  /* ── Recently updated rail (#48): the manifest's newest docs across every
     section. Most-opened is deferred — no open-count signal exists yet. ── */
  .rail { margin-top: 22px; }
  .rail-head {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px;
    padding-bottom: 9px; border-bottom: 1px solid var(--border);
  }
  .rail-title { font-family: var(--kb-font-heading); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--text); }
  .rail-sub { font-family: var(--kb-font-mono); font-size: 10px; color: var(--dim); }
  .rail-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .rail-item {
    display: flex; flex-direction: column; gap: 7px; padding: 11px 13px;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
    text-decoration: none; color: inherit; transition: border-color .12s;
  }
  .rail-item:hover { border-color: var(--red); }
  .rail-item-title { font-size: 12.5px; color: var(--text); line-height: 1.35; }
  .rail-item:hover .rail-item-title { color: var(--red); }
  .rail-item-foot { display: flex; align-items: center; gap: 8px; }
  .rail-item-section {
    font-family: var(--kb-font-mono); font-size: 9px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted);
  }

  /* ── States ── */
  .statebox, .errorbox {
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
    padding: 44px 28px; text-align: center; color: var(--muted); font-size: 13px;
  }
  .st-title { font-family: var(--kb-font-heading); font-size: 18px; letter-spacing: .1em; text-transform: uppercase; color: var(--text); margin-bottom: 6px; }
  .errorbox { border-color: rgba(58, 83, 164,.4); }
  .errorbox .st-title { color: var(--red); }
  .statebox code, .errorbox code { font-family: var(--kb-font-mono); font-size: 12px; color: var(--muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px; }
  .spinner { display: inline-block; width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Footer ── */
  .footer {
    border-top: 1px solid var(--border); padding: 20px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .footer-left { display: flex; align-items: center; gap: 16px; }
  .footer-text { font-family: var(--kb-font-mono); font-size: 10px; color: var(--dim); }

  @media (max-width: 560px) {
    .topbar, .page-head, .wrap, .footer { padding-left: 18px; padding-right: 18px; }
    .card-grid { grid-template-columns: 1fr; }
    .page-title { font-size: 32px; }
  }
</style>
<link rel="stylesheet" href="/app/theme.css">
<script src="/app/nav.js" defer></script>
<script src="/app/theme.js" defer></script>
</head>
<body>

<!-- Topbar -->
<header class="topbar">
  <div class="brand">
    <!-- Owner co-brand mark, linked home. The mark itself is NOT baked here:
         app/nav.js fills this slot from client.config.json branding.owner
         (KBNav.applyOwnerBrand), falling back to a text wordmark. -->
    <a href="/" class="brand-logo" aria-label="Home" data-kb-owner-mark="24"></a>
    <span class="brand-divider">×</span>
    <span class="brand-name" id="brand-name">—</span>
  </div>
  <nav class="topnav" id="topnav"></nav>
</header>

<!-- Page head -->
<nav class="crumb" aria-label="Breadcrumb"><a href="/">← Portal home</a></nav>

<section class="page-head">
  <div class="page-eyebrow">
    <span id="page-eyebrow-text">Library</span>
    <span class="page-eyebrow-line"></span>
  </div>
  <h1 class="page-title">Library</h1>
  <p class="page-subtitle">Browse the whole knowledge base by category — or search across wiki pages, session analyses, roadmaps, project memory, and live trackers.</p>
  <div class="page-meta" id="page-meta"><span id="total-count">—</span> documents</div>
</section>

<!-- Body -->
<div class="wrap">
  <!-- Categorized browse (docs-manifest.json) — rendered above the flat search.
       Hidden entirely when the manifest is absent or carries no docs. -->
  <section id="categories" hidden></section>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input class="search-input" id="search" type="text" placeholder="Search by title, summary, or path…" autocomplete="off" spellcheck="false" aria-label="Search the library">
    <button class="search-clear" id="search-clear" type="button" aria-label="Clear search">clear</button>
  </div>

  <div id="results">
    <div class="statebox">
      <div class="spinner"></div>
      <div class="st-title">Loading</div>
      <div>Fetching the knowledge base…</div>
    </div>
  </div>

  <nav class="pager" id="pager" aria-label="Pagination" hidden></nav>
</div>

<!-- Footer -->
<footer class="footer">
  <div class="footer-left">
    <!-- Owner co-brand mark, from client.config.json branding.owner (app/nav.js). -->
    <span class="footer-mark" data-kb-owner-mark="17"></span>
    <span class="footer-text" id="footer-text">—</span>
  </div>
</footer>

<script>
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── Branding + nav: fetch /client.config.json and re-brand the page ──────────
async function loadConfig() {
  let cfg;
  try {
    cfg = await fetch('/client.config.json', { cache: 'no-cache' }).then(r => r.json());
  } catch (e) { return; }

  const b = cfg.branding || {};
  const colors = b.colors || {};
  const fonts = b.fonts || {};
  const client = cfg.client || {};

  // CSS custom properties → re-brand colors + fonts.
  const root = document.documentElement.style;
  const setVar = (name, val) => { if (val) root.setProperty(name, val); };
  setVar('--kb-primary',      colors.primary);
  setVar('--kb-link',         colors.link);
  setVar('--kb-accent',       colors.accent);
  setVar('--kb-bg',           colors.bg);
  setVar('--kb-bg-deep',      colors.bgDeep);
  setVar('--kb-surface',      colors.surface);
  setVar('--kb-border',       colors.border);
  setVar('--kb-border-light', colors.borderLight);
  setVar('--kb-text',         colors.text);
  setVar('--kb-text-muted',   colors.textMuted);
  setVar('--kb-text-faint',   colors.textFaint);
  setVar('--kb-font-heading', fonts.heading);
  setVar('--kb-font-body',    fonts.body);
  setVar('--kb-font-mono',    fonts.mono);

  // Document title: "<client.name> — Library".
  const name = client.name || client.shortName || '';
  document.title = (name ? name + ' — ' : '') + 'Library';
  const set = (id, val) => { const el = document.getElementById(id); if (el && val != null) el.textContent = val; };
  set('brand-name', client.shortName || client.name || '');
  set('page-eyebrow-text', name ? name + ' Library' : 'Library');
  // Owner co-brand (#47): the owner name comes from branding.owner through
  // the shared seam in app/nav.js, never a literal in the page shell.
  set('footer-text', [client.shortName || client.name, KBNav.ownerName(cfg.branding)].filter(Boolean).join(' · '));

  buildNav(cfg.pages || []);
}

function buildNav(pages) {
  // Grouped top-nav + active-state come from the shared module so nav logic
  // can't drift between pages. See app/nav.js.
  KBNav.topnav(document.getElementById('topnav'), pages);
}

// ── Library (reads /app/knowledge-pack.json) ─────────────────────────────────
// Source areas are derived from each item's `path`. Order here is display order.
const GROUPS = [
  { id: 'wiki',     label: 'Wiki',             badge: 'badge-wiki' },
  { id: 'analyses', label: 'Meeting Analyses', badge: 'badge-analyses' },
  { id: 'docs',     label: 'Roadmaps & Docs',  badge: 'badge-docs' },
  { id: 'memory',   label: 'Project Memory',   badge: 'badge-memory' },
  { id: 'trackers', label: 'Trackers',         badge: 'badge-trackers' },
];
const GROUP_BY_ID = GROUPS.reduce((m, g) => (m[g.id] = g, m), {});

// Map a path to one of the group ids above.
function groupOf(path) {
  const p = String(path || '');
  if (/\.json$/i.test(p)) return 'trackers';
  if (p.indexOf('knowledge/wiki/') === 0 || p.indexOf('knowledge/platform-wiki/') === 0) return 'wiki';
  if (p.indexOf('knowledge/docs/sessions/') === 0) return 'analyses';
  if (p.indexOf('knowledge/docs/') === 0) return 'docs';
  if (p.indexOf('knowledge/memory/') === 0) return 'memory';
  return 'docs';
}

// Where a card links: .md → reader; .json (trackers) → the raw file at site root.
function hrefOf(path) {
  const p = String(path || '');
  if (/\.json$/i.test(p)) return '/' + p.replace(/^\/+/, '');
  return '/app/reader.html?f=' + encodeURIComponent(p);
}

function extOf(path) {
  const m = /\.([a-z0-9]+)$/i.exec(String(path || ''));
  return m ? m[1].toLowerCase() : '';
}

const PER_PAGE = 25;
const state = { items: [], query: '', page: 1, manifestSections: [] };

function matches(item) {
  if (!state.query) return true;
  const q = state.query;
  return (item.title || '').toLowerCase().indexOf(q) !== -1 ||
         (item.summary || '').toLowerCase().indexOf(q) !== -1 ||
         (item.path || '').toLowerCase().indexOf(q) !== -1;
}

function cardHTML(item) {
  const g = GROUP_BY_ID[item._group];
  return '<a class="doc-card" href="' + esc(hrefOf(item.path)) + '">' +
    '<span class="doc-card-title">' + esc(item.title || item.path) + '</span>' +
    (item.summary ? '<span class="doc-card-summary">' + esc(item.summary) + '</span>' : '') +
    '<span class="doc-card-foot">' +
      '<span class="badge ' + g.badge + '">' + esc(g.label) + '</span>' +
      '<span class="doc-card-ext">.' + esc(extOf(item.path)) + '</span>' +
    '</span>' +
  '</a>';
}

// Group header. `total` is the group's count across the FULL filtered set,
// not just the items visible on the current page.
function groupHead(group, total) {
  return '<div class="group-head">' +
    '<span class="group-title">' + esc(group.label) + '</span>' +
    '<span class="group-count">' + total + (total === 1 ? ' item' : ' items') + '</span>' +
  '</div>';
}

// Flatten the active filtered set into one ordered list (GROUPS display order,
// source order within each group). Carries each group's full count so headers
// stay accurate when a group is split across pages.
function filteredFlat() {
  const flat = [];
  const counts = {};
  GROUPS.forEach(group => {
    const items = state.items.filter(it => it._group === group.id && matches(it));
    counts[group.id] = items.length;
    items.forEach(it => flat.push(it));
  });
  return { flat, counts };
}

function renderPager(totalPages) {
  const pager = document.getElementById('pager');
  if (totalPages <= 1) { pager.hidden = true; pager.innerHTML = ''; return; }
  pager.hidden = false;
  const page = state.page;
  pager.innerHTML =
    '<button class="pager-btn" type="button" data-nav="prev"' + (page <= 1 ? ' disabled' : '') + '>Prev</button>' +
    '<span class="pager-status">Page <span>' + page + '</span> of <span>' + totalPages + '</span></span>' +
    '<button class="pager-btn" type="button" data-nav="next"' + (page >= totalPages ? ' disabled' : '') + '>Next</button>';
}

function render() {
  const resultsEl = document.getElementById('results');
  const { flat, counts } = filteredFlat();

  if (!flat.length) {
    resultsEl.innerHTML = '<div class="statebox">' +
      '<div class="st-title">No matches</div>' +
      (state.query ? 'No documents match “' + esc(state.query) + '”.' : 'No documents in the knowledge base.') +
    '</div>';
    renderPager(1);
    return;
  }

  const totalPages = Math.max(1, Math.ceil(flat.length / PER_PAGE));
  if (state.page > totalPages) state.page = totalPages;

  const start = (state.page - 1) * PER_PAGE;
  const pageItems = flat.slice(start, start + PER_PAGE);

  // Walk the page slice, opening a new group section whenever the group changes.
  // Group counts in the headers reflect the full filtered set (counts[...]).
  let html = '';
  let openGroup = null;
  pageItems.forEach(item => {
    if (item._group !== openGroup) {
      if (openGroup !== null) html += '</div></section>';
      const group = GROUP_BY_ID[item._group];
      html += '<section class="group">' + groupHead(group, counts[item._group]) + '<div class="card-grid">';
      openGroup = item._group;
    }
    html += cardHTML(item);
  });
  if (openGroup !== null) html += '</div></section>';

  resultsEl.innerHTML = html;
  renderPager(totalPages);
}

// Pager clicks → step a page.
document.getElementById('pager').addEventListener('click', e => {
  const btn = e.target.closest('.pager-btn');
  if (!btn || btn.disabled) return;
  const nav = btn.getAttribute('data-nav');
  if (nav === 'prev') state.page--;
  else if (nav === 'next') state.page++;
  render();
});

async function loadLibrary() {
  const resultsEl = document.getElementById('results');
  let data;
  try {
    const r = await fetch('/app/knowledge-pack.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch (err) {
    resultsEl.innerHTML = '<div class="errorbox">' +
      '<div class="st-title">Failed to load</div>' +
      'Could not fetch <code>app/knowledge-pack.json</code> (' + esc(err.message) + ').' +
    '</div>';
    return;
  }

  const items = Array.isArray(data.items) ? data.items : [];
  // Tag each item with its derived group up front so filtering stays cheap.
  state.items = items.map(it => Object.assign({}, it, { _group: groupOf(it.path) }));

  const count = (typeof data.count === 'number') ? data.count : state.items.length;
  document.getElementById('total-count').textContent = count;

  if (!state.items.length) {
    resultsEl.innerHTML = '<div class="statebox">' +
      '<div class="st-title">Knowledge base empty</div>' +
      'Documents will appear here once the knowledge pack is generated.' +
    '</div>';
    return;
  }

  render();
}

// ── Search wiring ────────────────────────────────────────────────────────────
const searchEl = document.getElementById('search');
const searchClearEl = document.getElementById('search-clear');
searchEl.addEventListener('input', () => {
  state.query = searchEl.value.trim().toLowerCase();
  state.page = 1;
  searchClearEl.classList.toggle('show', !!searchEl.value);
  render();
  renderShelf();
});
searchClearEl.addEventListener('click', () => {
  searchEl.value = '';
  state.query = '';
  state.page = 1;
  searchClearEl.classList.remove('show');
  searchEl.focus();
  render();
  renderShelf();
});

// ── Categorized browse (reads /app/docs-manifest.json) ───────────────────────
// Renders sections → groups → docs as shelf cards (a grid of collapsed <details>;
// the opened one spans full width), plus a "recently updated" rail, above the
// flat search. Both re-render on every search keystroke so browsing and search
// share one query instead of the tree staying static while only the flat grid
// below responds. The knowledge-pack search below stays the source of truth for
// full-text find. Absent/empty manifest → the whole panel stays hidden, so the
// page degrades to the flat library cleanly. Most-opened rail is deferred (#48):
// no open-count signal exists yet (no client- or server-side analytics).
function docHref(path) {
  const p = String(path || '');
  if (/\.json$/i.test(p)) return '/' + p.replace(/^\/+/, '');
  return '/app/reader.html?f=' + encodeURIComponent(p);
}

// A manifest doc matches the shared search query by title or path (manifest
// entries carry no summary text, unlike knowledge-pack items — see matches()).
function matchesManifestDoc(doc, q) {
  if (!q) return true;
  return (doc.title || '').toLowerCase().indexOf(q) !== -1 ||
         (doc.path || '').toLowerCase().indexOf(q) !== -1;
}

// Per-doc metadata chips: doc-type (path extension, via the shared extOf()),
// reading time (docs-manifest's additive `reading_time`, minutes), updated date.
function chipRow(d) {
  const ext = extOf(d.path);
  const parts = [];
  if (ext) parts.push('<span class="chip-ext">.' + esc(ext) + '</span>');
  if (typeof d.reading_time === 'number') parts.push('<span class="chip-time">' + d.reading_time + ' min read</span>');
  if (d.updated) parts.push('<span class="cat-doc-date">' + esc(d.updated) + '</span>');
  return parts.length ? '<span class="cat-doc-meta">' + parts.join('') + '</span>' : '';
}

function docRow(d) {
  return '<a class="cat-doc" href="' + esc(docHref(d.path)) + '">' +
    '<span class="cat-doc-title">' + esc(d.title || d.path) + '</span>' +
    chipRow(d) +
  '</a>';
}

// Flatten one section's docs (including grouped docs) into a single array, each
// tagged with the section's label — used by the recently-updated rail, which
// reads across every section rather than one at a time.
function flattenSection(section) {
  const out = (section.docs || []).slice();
  (section.groups || []).forEach(g => out.push(...(g.docs || [])));
  return out.map(d => Object.assign({}, d, { _section: section.label || section.id }));
}

function sectionCardHTML(section, first, query) {
  const docs = (section.docs || []).filter(d => matchesManifestDoc(d, query));
  const groups = (section.groups || [])
    .map(g => Object.assign({}, g, { docs: (g.docs || []).filter(d => matchesManifestDoc(d, query)) }))
    .filter(g => g.docs.length);
  const shown = docs.length + groups.reduce((n, g) => n + g.docs.length, 0);
  if (!shown) return '';           // nothing in this section matches -> hide the card
  const total = (typeof section.count === 'number')
    ? section.count
    : (section.docs || []).length + (section.groups || []).reduce((n, g) => n + (g.docs || []).length, 0);
  let body = '';
  docs.forEach(d => { body += docRow(d); });
  groups.forEach(g => {
    body += '<div class="cat-group">' +
      (g.label ? '<div class="cat-group-label">' + esc(g.label) + '</div>' : '') +
      g.docs.map(docRow).join('') +
    '</div>';
  });
  // A section with search matches opens itself so results are visible with no
  // extra click; with no query, only the first (non-empty) card defaults open.
  const open = query ? true : first;
  const countLabel = query ? (shown + ' / ' + total) : String(total);
  return '<details class="cat"' + (open ? ' open' : '') + '>' +
    '<summary class="cat-summary">' +
      '<span class="cat-caret"></span>' +
      '<span class="cat-label">' + esc(section.label || section.id) + '</span>' +
      '<span class="cat-count">' + countLabel + (total === 1 && !query ? ' doc' : ' docs') + '</span>' +
    '</summary>' +
    (section.description ? '<p class="cat-desc">' + esc(section.description) + '</p>' : '') +
    '<div class="cat-body">' + body + '</div>' +
  '</details>';
}

function renderShelfGrid(sections, query) {
  let cards = '';
  let first = true;
  sections.forEach(s => {
    const html = sectionCardHTML(s, first, query);
    if (html) { cards += html; first = false; }
  });
  return cards;
}

const RECENT_LIMIT = 8;
function renderRecentRail(sections, query) {
  const all = [];
  sections.forEach(s => flattenSection(s).forEach(d => all.push(d)));
  const matched = all.filter(d => matchesManifestDoc(d, query));
  if (!matched.length) return '';
  matched.sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));
  const top = matched.slice(0, RECENT_LIMIT);
  const items = top.map(d =>
    '<a class="rail-item" href="' + esc(docHref(d.path)) + '">' +
      '<span class="rail-item-title">' + esc(d.title || d.path) + '</span>' +
      '<span class="rail-item-foot">' +
        '<span class="rail-item-section">' + esc(d._section || '') + '</span>' +
        chipRow(d) +
      '</span>' +
    '</a>'
  ).join('');
  return '<div class="rail">' +
    '<div class="rail-head">' +
      '<span class="rail-title">Recently updated</span>' +
      '<span class="rail-sub">' + top.length + ' of ' + matched.length + '</span>' +
    '</div>' +
    '<div class="rail-list">' + items + '</div>' +
  '</div>';
}

// Re-render the shelf grid + rail from the manifest already in state, filtered
// by the shared search query. Called once on load and again on every keystroke.
function renderShelf() {
  const host = document.getElementById('categories');
  const sections = state.manifestSections;
  if (!sections.length) { host.hidden = true; host.innerHTML = ''; return; }
  const grid = renderShelfGrid(sections, state.query);
  const rail = renderRecentRail(sections, state.query);
  if (!grid && !rail) { host.hidden = true; host.innerHTML = ''; return; }
  host.innerHTML =
    (grid ? '<div class="cats-head">' +
      '<span class="cats-title">Browse by category</span>' +
      '<span class="cats-sub">' + sections.length + (sections.length === 1 ? ' section' : ' sections') + '</span>' +
    '</div>' +
    '<div class="shelf-grid">' + grid + '</div>' : '') +
    rail;
  host.hidden = false;
}

async function loadManifest() {
  let data;
  try {
    const r = await fetch('/app/docs-manifest.json', { cache: 'no-cache' });
    if (!r.ok) return;            // no manifest yet → flat library only
    data = await r.json();
  } catch (e) { return; }
  state.manifestSections = Array.isArray(data.sections) ? data.sections : [];
  renderShelf();
}

loadConfig();
loadManifest();
loadLibrary();
</script>
</body>
</html>
